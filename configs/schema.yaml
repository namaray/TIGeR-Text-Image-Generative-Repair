# Declarative schema and constraint set C (roadmap 2.4, findings F9/F10).
#
# Omega_j: legal value domain per checkable attribute.
# constraints: cross-field rules evaluated by tiger.schema.validate_attrs.
#
# Every repair patch value MUST validate against this file before it is applied
# (roadmap 1.5); out-of-domain values are refused and escalated.

attributes:
  color:
    # Required only where colour is a primary customer-facing differentiator and
    # is reliably populated. Measured on the local ABO release: sofa 95%, lamp
    # 97%, ottoman 97%, handbag 92%, hat 93%, suitcase 96%. Types below ~85% are
    # left optional so a missing colour escalates on its merits rather than
    # failing schema validation outright (the H10 failure mode).
    # Synthetic fashion categories: colour is always generated, so requiring it
    # is what lets the schema check catch `attribute_drop` (recall 1.000). Do not
    # remove these -- doing so silently kills that detection signal.
    # ABO types: listed only where colour is reliably populated (sofa 95%,
    # lamp 97%, ottoman 97%, handbag 92%, hat 93%, suitcase 96%). Types below
    # ~85% stay optional so a missing colour escalates on its merits rather than
    # failing schema validation outright -- the H10 failure mode.
    # Synthetic fashion categories ONLY. synthgen always generates a colour, so
    # requiring it is what lets the schema check catch `attribute_drop`
    # (recall 1.000). Do not remove these -- it silently kills that signal.
    #
    # No ABO category is listed. Measured post-normalisation colour coverage
    # across the two verticals runs 45.5% (hat) to 92.8% (wall_art); nothing is
    # near guaranteed. Requiring it would mark every genuinely-clean-but-
    # incomplete row as a schema violation, flag it as dirty, and tank
    # precision -- the H10 failure mode, which was diagnosed as a `color`
    # requirement that was too broad and is repeated by re-adding one here.
    required_for_categories: [shirts, shoes, bags, hats]
    type: enum
    # Omega_color: canonical values ONLY. A surface form that maps onto one of
    # these belongs in `aliases`, never in both -- see tiger/schema.py, which
    # refuses to load a schema where the two sets intersect.
    #
    # silver/gold/beige/navy/teal were previously listed here AND aliased. Three
    # things followed:
    #   - schema.domain() returned 17 entries of which 5 were semantic
    #     duplicates, so the contrastive probes scored "silver" against "gray"
    #     as rival candidates for the same pixels;
    #   - anything comparing a raw domain value to a normalised one broke
    #     (verify.check_v2t vetoed correct repairs, sieve._title_color invented
    #     contradictions);
    #   - synthgen and the noise injector draw colours from this list, and
    #     COLOR_RGB has no entry for the five, so `cli synthgen` raised KeyError
    #     on roughly a third of products -- which is why data/sample/ cannot
    #     currently be regenerated.
    values: [red, blue, green, black, white, yellow, pink, purple, brown, orange, gray, multicolour]
    aliases:
      grey: gray
      multicolor: multicolour
      multi-color: multicolour
      # ABO surface forms. These are recognised in text and normalised into
      # Omega_color; they are deliberately not domain members of their own.
      silver: gray
      gold: yellow
      beige: white
      navy: blue
      teal: green
  material:
    type: enum
    # `stone` added for the ABO furnishing verticals: 483 instances (5.8% of all
    # material values there) and the single largest unresolved material.
    values: [cotton, leather, canvas, wool, denim, suede, polyester,
             plastic, metal, glass, wood, ceramic, rubber, silicone, fabric, paper,
             stone]
  pattern:
    type: enum
    values: [solid, striped, dotted]
  size:
    type: enum
    values: [XS, S, M, L, XL, "6", "7", "8", "9", "10", "11", one-size]
  brand:
    type: free_text
    max_len: 60

# Two ABO verticals (Collins et al., CVPR 2022), replacing the Kaggle Myntra set.
# Per product type rather than per vertical: tau thresholds and the T2V candidate
# pool are category-scoped, so a chair is only ever repaired with another chair.
#   furnishing  : chair sofa table ottoman stool rug lamp light_fixture wall_art
#   accessories : ring necklace earring handbag suitcase hat
# The synthetic catalogue (tiger/data/synthgen.py) keeps its own four fashion
# categories -- it is an independent detection benchmark, not part of this run.
categories: [chair, sofa, table, ottoman, stool, rug, lamp, light_fixture, wall_art,
             ring, necklace, earring, handbag, suitcase, hat,
             shirts, shoes, bags, hats]

# Cross-field constraints. Each rule: {if: {category: X}, allow: {field: [values]}}
#
# The two size rules below apply only to the synthetic fashion catalogue. The ABO
# furnishing and accessory verticals carry no size enum, so they are unconstrained
# here rather than carrying dead rules -- ABO listings state dimensions in free
# text, which is not a finite domain a probe can enumerate.
constraints:
  - name: shoes_have_numeric_sizes
    if: {category: shoes}
    allow: {size: ["6", "7", "8", "9", "10", "11", one-size]}
  - name: apparel_letter_sizes
    if: {category: shirts}
    allow: {size: [XS, S, M, L, XL, one-size]}
